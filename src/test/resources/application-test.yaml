spring:
  datasource:
    url: jdbc:tc:mysql:8.4:///settlement_batch
    username: settlement
    password: settlement
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always
      schema-locations: classpath:batch-schema-mysql.sql
  batch:
    job:
      enabled: false
