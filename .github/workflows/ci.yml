name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SETTLEMENT_DB_URL: jdbc:mysql://localhost:3307/settlement_batch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SETTLEMENT_DB_USERNAME: settlement
      SETTLEMENT_DB_PASSWORD: settlement

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: settlement_batch
          MYSQL_USER: settlement
          MYSQL_PASSWORD: settlement
          MYSQL_ROOT_PASSWORD: root
          TZ: Asia/Seoul
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
          --health-start-period=20s

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon
